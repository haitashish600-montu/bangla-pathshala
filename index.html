/* =========================================================
UTILITY
========================================================= */

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escAttr(v){

return esc(v).replace(/`/g,"&#096;");

}

document.getElementById("modal").classList.remove("show");

/* =========================================================
YOUTUBE
========================================================= */

function youtubeEmbed(url){

let u=String(url||"");

if(u.includes("youtube.com/watch?v=")){

u=u.replace(
"https://www.youtube.com/watch?v=",
"https://www.youtube.com/embed/"
).split("&")[0];

}

else if(u.includes("youtu.be/")){

u=u.replace(
"https://youtu.be/",
"https://www.youtube.com/embed/"
).split("?")[0];

}

return u;

}

function submitTest(answers){

let score=0;

answers.forEach((ans,i)=>{

const el=document.querySelector(
'input[name="q'+i+'"]:checked'
);

if(
el &&
Number(el.value)===Number(ans)
){

score++;

}

});


const box=document.getElementById("testResult");

if(box){

box.innerHTML=`

<div class="score">

আপনার Score:
${score}
/
${answers.length}

</div>

`;

}

}

if(!b)return;


if(
localStorage.getItem("bp_logged")==="1"
){

b.textContent="Logout";

b.classList.remove("loginBtn");

}

b.classList.remove("logoutBtn");

b.classList.add("loginBtn");

}

}

["I","J","C"].includes(
e.key.toUpperCase()
)
)

||

(
e.ctrlKey &&
["U","S","P"].includes(
e.key.toUpperCase()
)
)

){

e.preventDefault();

}

}
);

<script>

/* ===== Banner Menu Auto Add ===== */

function addBannerMenu() {

  const hero = document.querySelector(".hero");

  if (!hero) return;

  /* আগে থেকে থাকলে আবার বানাবে না */
  if (hero.querySelector(".bannerMenuBtn")) return;

  const menu = document.createElement("button");

  menu.className = "bannerMenuBtn";
  menu.type = "button";
  menu.innerHTML = "☰";
  menu.setAttribute("aria-label", "Menu");

  menu.onclick = function(e) {

    e.preventDefault();
    e.stopPropagation();

    /* উপরের যে Menu কাজ করছে সেটিই ব্যবহার করবে */
    if (typeof openDrawer === "function") {
      openDrawer();
    }

  };

  hero.appendChild(menu);
}


/* প্রথমবার */
addBannerMenu();


/* Home page আবার খুললে Banner নতুন করে তৈরি হয়।
   তাই তখনও Menu automatically বসবে। */
const bannerObserver = new MutationObserver(function() {
  addBannerMenu();
});

const appArea = document.getElementById("app");

if (appArea) {
  bannerObserver.observe(appArea, {
    childList: true,
    subtree: true
  });
}

</script>
