<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c4ce6"><title>বাংলা পাঠশালা</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fc;color:#20243a;font-family:"Noto Sans Bengali","Nirmala UI",system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh}.hero{padding:30px 20px;background:linear-gradient(145deg,#6c4ce6,#8d6cf7);color:white;border-radius:0 0 30px 30px}.badge{font-size:12px;background:#ffffff22;padding:7px 12px;border-radius:99px}.hero h1{font-size:30px;margin:16px 0 4px}.hero p{margin:0;opacity:.9}.search{margin-top:20px;background:white;border-radius:16px;padding:12px;display:flex;gap:8px}.search input{border:0;outline:0;width:100%;font-size:14px}.main{padding:20px}.title{margin:5px 2px 12px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.item{border:1px solid #e9eaf2;background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px #24204d0a;cursor:pointer}.card{text-align:left}.icon{font-size:27px;margin-bottom:10px}.card b{display:block}.card small{color:#73778c}.view{display:none}.view.active{display:block}.top{position:sticky;top:0;background:#fff;padding:14px 18px;border-bottom:1px solid #e9eaf2;display:flex;gap:12px;align-items:center}.back{border:0;background:#f0effa;border-radius:12px;width:40px;height:40px}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;border-radius:16px}.arrow{color:#6c4ce6;font-weight:bold}.note{background:#fff;border:1px solid #e9eaf2;border-radius:18px;padding:20px;line-height:1.9}.primary{border:0;background:#6c4ce6;color:#fff;border-radius:14px;padding:13px 18px;font-weight:bold}.opt{display:block;width:100%;margin-top:8px;padding:12px;text-align:left;border:1px solid #e9eaf2;background:#fafaff;border-radius:12px}.opt.sel{background:#eeeaff;border-color:#6c4ce6}
</style></head><body><div class="app">
<section id="home" class="view active"><header class="hero"><span class="badge">🎓 বাংলা শিক্ষা • ৯ম–১২শ</span><h1>বাংলা পাঠশালা</h1><p>শিক্ষক : আশিস স্যার</p><div class="search">🔎<input id="search" placeholder="নোট, অধ্যায় বা বিষয় খুঁজুন…"></div></header><main class="main"><h2 class="title">শ্রেণি নির্বাচন করুন</h2><div class="grid" id="classes"></div><h2 class="title" style="margin-top:26px">দ্রুত প্রবেশ</h2><div class="grid"><button class="card" onclick="openView('notes')">📚<b>অধ্যায়ভিত্তিক নোট</b><small>গুছিয়ে পড়ুন</small></button><button class="card" onclick="openView('grammar')">📘<b>বাংলা ব্যাকরণ</b><small>Practice</small></button><button class="card" onclick="openView('rachona')">✍️<b>রচনা</b><small>শ্রেণি অনুযায়ী</small></button><button class="card" onclick="openView('exam')">🧪<b>পরীক্ষা</b><small>নিজেকে যাচাই করুন</small></button></div></main></section>
<section id="class" class="view"><div class="top"><button class="back" onclick="home()">←</button><h2 id="ct"></h2></div><main class="main"><div class="grid"><button class="card" onclick="openView('notes')">📖<b>বাংলা সাহিত্য</b><small>অধ্যায়ভিত্তিক নোট</small></button><button class="card" onclick="openView('grammar')">📘<b>বাংলা ব্যাকরণ</b><small>নিয়ম ও অনুশীলন</small></button><button class="card" onclick="openView('rachona')">✍️<b>রচনা</b><small>লিখিত প্রস্তুতি</small></button><button class="card" onclick="openView('exam')">🧪<b>অধ্যায়ভিত্তিক পরীক্ষা</b><small>MCQ ও ফলাফল</small></button><button class="card" onclick="openView('exam')">🎯<b>Model Test</b><small>সম্পূর্ণ প্রস্তুতি</small></button><button class="card" onclick="openView('result')">📊<b>ফলাফল</b><small>Score</small></button></div></main></section>
<section id="notes" class="view"><div class="top"><button class="back" onclick="back()">←</button><h2>অধ্যায়ভিত্তিক নোট</h2></div><main class="main"><div class="list" id="chapters"></div></main></section>
<section id="grammar" class="view"><div class="top"><button class="back" onclick="back()">←</button><h2>বাংলা ব্যাকরণ</h2></div><main class="main"><div class="list" id="grams"></div></main></section>
<section id="rachona" class="view"><div class="top"><button class="back" onclick="back()">←</button><h2>রচনা</h2></div><main class="main"><div class="list" id="rach"></div></main></section>
<section id="detail" class="view"><div class="top"><button class="back" onclick="back()">←</button><h2 id="dt"></h2></div><main class="main"><div class="note" id="db"></div></main></section>
<section id="exam" class="view"><div class="top"><button class="back" onclick="back()">←</button><h2>অধ্যায়ভিত্তিক পরীক্ষা</h2></div><main class="main" id="examBody"></main></section>
<section id="result" class="view"><div class="top"><button class="back" onclick="back()">←</button><h2>ফলাফল</h2></div><main class="main"><div class="note" style="text-align:center">এখনও কোনো পরীক্ষা দেওয়া হয়নি।</div></main></section>
</div>
<script>
const cls=[['9','📘','নবম শ্রেণি'],['10','📗','দশম শ্রেণি'],['11','📙','একাদশ শ্রেণি'],['12','📕','দ্বাদশ শ্রেণি']];let current='9';
document.getElementById('classes').innerHTML=cls.map(x=>`<button class="card" onclick="selectClass('${x[0]}')"><div class="icon">${x[1]}</div><b>${x[2]}</b><small>বাংলা প্রস্তুতি</small></button>`).join('');
document.getElementById('chapters').innerHTML=['অধ্যায় ১','অধ্যায় ২','অধ্যায় ৩'].map((x,i)=>`<div class="item" onclick="detail('${x}')"><div>${x}</div><span class="arrow">›</span></div>`).join('');
document.getElementById('grams').innerHTML=['সন্ধি','সমাস','কারক ও বিভক্তি','প্রত্যয়','উপসর্গ','বাক্য','অলংকার','ছন্দ'].map(x=>`<div class="item" onclick="detail('${x}')"><div>${x}</div><span class="arrow">›</span></div>`).join('');
document.getElementById('rach').innerHTML=cls.map(x=>`<div class="item" onclick="detail('${x[2]}-র রচনা')"><div>${x[2]}-র প্রবন্ধ রচনা</div><span class="arrow">›</span></div>`).join('');
function openView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}
function selectClass(id){current=id;document.getElementById('ct').textContent=cls.find(x=>x[0]===id)[2];openView('class')}
function home(){openView('home')}function back(){openView('class')}
function detail(t){document.getElementById('dt').textContent=t;document.getElementById('db').innerHTML=`<h2>${t}</h2><p>এখানে আপনার নির্দিষ্ট পাঠ্যসূচি অনুযায়ী বিস্তারিত নোট, গুরুত্বপূর্ণ প্রশ্নোত্তর এবং অনুশীলনী যোগ করা যাবে।</p><p>নতুন content পরে যোগ করা যাবে—মূল design পরিবর্তন করার দরকার হবে না।</p>`;openView('detail')}
const qs=[['বাংলা পাঠশালার মূল বিষয় কী?',['বাংলা শিক্ষা','গণিত','ইতিহাস','বিজ্ঞান'],0],['অধ্যায়ভিত্তিক পরীক্ষায় কী থাকবে?',['শুধু নোট','MCQ ও ফলাফল','শুধু ভিডিও','শুধু রচনা'],1]];
let ans={};function renderExam(){document.getElementById('examBody').innerHTML=qs.map((q,i)=>`<div class="note" style="margin-bottom:12px"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" onclick="pick(${i},${j},this)">${o}</button>`).join('')}</div>`).join('')+'<button class="primary" onclick="submit()">পরীক্ষা জমা দিন</button>'}
function pick(i,j,e){ans[i]=j;e.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));e.classList.add('sel')}
function submit(){let s=qs.reduce((n,q,i)=>n+(ans[i]===q[2]?1:0),0);document.getElementById('examBody').innerHTML=`<div class="note" style="text-align:center"><h2>পরীক্ষা সম্পন্ন 🎉</h2><h1>${s}/${qs.length}</h1><p>${Math.round(s/qs.length*100)}%</p><button class="primary" onclick="openView('result')">ফলাফল দেখুন</button></div>`;ans={}}
document.getElementById('search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q)return;let a=['অধ্যায় ১','অধ্যায় ২','অধ্যায় ৩',...['সন্ধি','সমাস','কারক ও বিভক্তি','প্রত্যয়','উপসর্গ','বাক্য','অলংকার','ছন্দ'],'রচনা','বাংলা সাহিত্য','বাংলা ব্যাকরণ'].filter(x=>x.toLowerCase().includes(q));document.getElementById('chapters').innerHTML=(a.length?a:['কোনো ফল পাওয়া যায়নি']).map(x=>`<div class="item"><div>${x}</div></div>`).join('');openView('notes')};renderExam();
</script></body></html>
