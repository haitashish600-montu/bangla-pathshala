<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Sans Bengali","Nirmala UI","Hind Siliguri",Arial,sans-serif;
  background:#f3f6fb;color:#12263f;line-height:1.65
}
button,a{font:inherit}
button{cursor:pointer}
img{max-width:100%}

:root{
 --nav:#062f5f;
 --blue:#087bd3;
 --yellow:#ffd21a;
 --purple:#7b2ff7;
 --green:#18a85a;
 --red:#ef3e4a;
 --card:#fff;
 --muted:#6b7785
}

/* NAVIGATION */
.topbar{
 background:var(--nav);color:#fff;position:sticky;top:0;
 z-index:1000;box-shadow:0 3px 15px #001d3d55
}
.navinner{
 max-width:1450px;margin:auto;height:62px;padding:0 18px;
 display:flex;align-items:center;justify-content:space-between
}
.brand{font-size:21px;font-weight:900}
.brand span{color:var(--yellow)}
.navlinks{display:flex;gap:7px;align-items:center}
.navlinks button{
 border:0;background:transparent;color:white;padding:9px 13px;
 border-radius:9px;font-weight:700
}
.navlinks button:hover{background:#ffffff18}
.menu{
 display:none;border:0;background:#ffffff16;color:#fff;
 font-size:25px;padding:5px 10px;border-radius:8px
}

/* BANNER */
.hero{
 width:100%;background:#071d3e;overflow:hidden
}
.hero img{
 width:100%;display:block;
 object-fit:cover
}
.heroFallback{
 display:none;color:white;text-align:center;padding:45px 20px;
 background:linear-gradient(135deg,#062f5f,#7b2ff7)
}
.heroFallback h1{font-size:40px}
.heroFallback b{color:#ffd21a}

/* MAIN */
.container{
 width:min(1500px,94%);margin:auto;padding:28px 0 60px
}
.sectionTitle{
 font-size:29px;color:#073866;font-weight:900;margin:25px 0 5px
}
.sectionSub{color:#738092;margin-bottom:18px}

/* QUICK */
.quickGrid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px
}
.quickCard{
 background:#fff;border-radius:20px;padding:24px;
 min-height:135px;display:flex;align-items:center;gap:20px;
 box-shadow:0 5px 22px #143a5d16;
 border-left:7px solid var(--blue);transition:.2s
}
.quickCard:hover{transform:translateY(-3px)}
.quickCard:nth-child(2){border-color:#f59e0b}
.quickCard:nth-child(3){border-color:#20a957}
.quickCard:nth-child(4){border-color:#8b3fd9}
.quickCard:nth-child(5){border-color:#ef3e4a}
.quickCard:nth-child(6){border-color:#0758bd}
.quickIcon{font-size:55px;min-width:70px;text-align:center}
.quickCard h3{font-size:24px}
.quickCard p{color:#697786}

/* CLASS */
.classGrid{
 display:grid;grid-template-columns:repeat(4,1fr);gap:20px
}
.classCard{
 background:#fff;border-radius:20px;padding:25px;
 box-shadow:0 5px 22px #143a5d16;cursor:pointer;
 position:relative;overflow:hidden
}
.classCard:after{
 content:"";position:absolute;right:-20px;top:-20px;
 width:80px;height:80px;background:#ffe66d88;border-radius:50%
}
.classIcon{font-size:48px}
.classCard h3{font-size:24px;margin-top:8px}
.classCard p{color:#6d7883}
.badge{
 display:inline-block;background:#e8f4ff;color:#0871c7;
 padding:4px 10px;border-radius:20px;font-size:13px;margin-top:8px
}

/* CONTENT BOX */
.contentBox{
 background:#fff;border-radius:20px;padding:24px;margin:22px 0;
 box-shadow:0 4px 20px #143a5d12
}
.contentBox h2{font-size:25px;color:#073866;margin-bottom:12px}

/* CHAPTERS */
.chapterGrid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:16px
}
.chapter{
 background:#fff;border-radius:16px;padding:20px;
 border:1px solid #e8edf4;box-shadow:0 3px 14px #143a5d10;
 cursor:pointer
}
.chapter:hover{border-color:#7b2ff7}
.chapter h3{font-size:20px}
.chapter small{color:#77818e}

/* PAGE */
.pageHead{
 background:linear-gradient(135deg,#062f5f,#155fa8);
 color:white;border-radius:20px;padding:28px;margin-bottom:20px
}
.pageHead h1{font-size:32px}
.back{
 border:0;background:#fff;color:#063767;border-radius:9px;
 padding:8px 15px;margin-bottom:15px;font-weight:800
}

/* CHAPTER OPTIONS */
.optionGrid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:18px
}
.option{
 background:#fff;border-radius:18px;padding:25px;
 box-shadow:0 4px 18px #143a5d13
}
.option h3{font-size:23px}
.option p{color:#707b88;margin:7px 0 15px}
.btn{
 border:0;background:#7b2ff7;color:#fff;padding:10px 17px;
 border-radius:9px;font-weight:800
}
.btn.blue{background:#087bd3}
.btn.green{background:#18a85a}
.btn.red{background:#ef3e4a}
.btn.dark{background:#062f5f}

/* STUDY */
.study{
 background:#fff;padding:25px;border-radius:18px;
 box-shadow:0 4px 18px #143a5d10
}
.studyText{
 font-size:19px;white-space:pre-wrap
 user-select:none;-webkit-user-select:none
}

/* VIDEO */
.videoBox{
 position:relative;padding-top:56.25%;overflow:hidden;
 border-radius:15px;background:#071d3e
}
.videoBox iframe{
 position:absolute;inset:0;width:100%;height:100%;border:0
}

/* MOCK */
.question{
 background:#fff;border-radius:18px;padding:22px;margin-bottom:15px;
 box-shadow:0 3px 15px #143a5d12
}
.question h3{margin-bottom:15px}
.answers label{
 display:block;border:1px solid #dfe5ec;padding:12px;
 border-radius:10px;margin:8px 0;cursor:pointer
}
.answers label:hover{background:#f2f7ff}
.result{
 background:#eaf8ef;border:1px solid #9bd8af;
 padding:20px;border-radius:15px;margin-bottom:20px
}
.wrong{
 background:#fff0f0;border-left:5px solid #ef3e4a;
 padding:13px;margin:10px 0;border-radius:8px
}
.correct{
 background:#edfff3;border-left:5px solid #18a85a;
 padding:13px;margin:10px 0;border-radius:8px
}

/* COLLEGE */
.collegeGrid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:18px
}
.collegeCard{
 background:#fff;border-radius:18px;padding:23px;
 box-shadow:0 3px 15px #143a5d12
}

/* MODEL */
.modelGrid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:15px
}
.model{
 background:#fff;border-radius:15px;padding:18px;
 display:flex;justify-content:space-between;align-items:center;
 box-shadow:0 3px 12px #143a5d12
}

/* LOGIN */
.loginBox{
 max-width:430px;margin:50px auto;background:#fff;padding:30px;
 border-radius:20px;box-shadow:0 5px 25px #143a5d20
}
.input{
 width:100%;padding:13px;border:1px solid #d8dee7;
 border-radius:9px;margin:8px 0 15px
}

/* FOOTER */
.footer{
 background:#062f5f;color:white;text-align:center;padding:22px;margin-top:30px
}

/* BOTTOM NAV */
.bottomNav{
 position:fixed;bottom:0;left:0;right:0;background:#fff;
 box-shadow:0 -3px 18px #143a5d22;z-index:900;
 display:flex;justify-content:space-around;padding:8px
}
.bottomNav button{
 border:0;background:none;color:#092d54;
 display:flex;flex-direction:column;align-items:center;
 font-size:13px
}
.bottomNav span{font-size:25px}

/* NOTICE */
.notice{
 background:#fff;padding:12px 20px;white-space:nowrap;
 overflow:hidden;border-bottom:1px solid #eee
}
.notice b{color:#ef8a00}

/* RESPONSIVE */
@media(max-width:900px){
 .quickGrid{grid-template-columns:repeat(2,1fr)}
 .classGrid{grid-template-columns:repeat(2,1fr)}
 .chapterGrid{grid-template-columns:repeat(2,1fr)}
 .collegeGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
 .navlinks{display:none}
 .menu{display:block}
 .quickGrid,.classGrid,.chapterGrid,
 .optionGrid,.collegeGrid,.modelGrid{grid-template-columns:1fr}
 .hero img{min-height:180px;object-fit:cover}
 .sectionTitle{font-size:25px}
 .quickCard{min-height:110px;padding:18px}
 .quickIcon{font-size:40px;min-width:50px}
 .quickCard h3{font-size:20px}
 .classCard h3{font-size:21px}
 .container{width:92%;padding-bottom:90px}
}
.hidden{display:none!important}
</style>

/* =====================================================
   MOCK TEST ENGINE
   ===================================================== */

let mockQuestions=[];
let mockAnswers=[];

function startMock(){

 mockQuestions=[
   ...MOCKS.default
 ];

 /* প্রতি বার প্রশ্ন এলোমেলো */
 mockQuestions.sort(()=>Math.random()-.5);

 mockAnswers=new Array(mockQuestions.length).fill(null);

 renderMock();
}

function renderMock(){

 let html=`

 <main class="container">

  <button class="back" onclick="openChapter('${current.classId}',${current.index})">
   ← অধ্যায়ে ফিরে যান
  </button>

  <div class="pageHead">
   <h1>📝 Mock Test</h1>
   <p>প্রশ্নগুলো প্রতিবার এলোমেলোভাবে আসবে</p>
  </div>

  <form id="mockForm">

 `;

 mockQuestions.forEach((q,i)=>{

  html+=`
   <div class="question">
    <h3>${i+1}. ${q.q}</h3>

    <div class="answers">

     ${q.a.map((a,j)=>`
      <label>
       <input type="radio"
        name="q${i}"
        value="${j}">
       ${a}
      </label>
     `).join("")}

    </div>

   </div>
  `;

 });

 html+=`

   <button type="button"
    class="btn green"
    onclick="submitMock()">
    পরীক্ষা জমা দিন
   </button>

  </form>

 </main>`;

 document.getElementById("app").innerHTML=html;
}


function submitMock(){

 let score=0;

 mockQuestions.forEach((q,i)=>{

  const selected=document.querySelector(
   'input[name="q'+i+'"]:checked'
  );

  if(selected){
   mockAnswers[i]=Number(selected.value);
   if(mockAnswers[i]===q.ans)score++;
  }

 });

 let html=`

 <main class="container">

  <div class="pageHead">
   <h1>📊 ফলাফল</h1>
   <p>আপনার Mock Test-এর ফলাফল</p>
  </div>

  <div class="result">
   <h2>আপনার স্কোর : ${score} / ${mockQuestions.length}</h2>
   <p>আবার চাইলে নতুন করে Mock Test দিতে পারবেন।</p>
  </div>

  <h2 class="sectionTitle">উত্তর যাচাই</h2>
 `;

 mockQuestions.forEach((q,i)=>{

  const your=mockAnswers[i];
  const ok=your===q.ans;

  html+=`

   <div class="${ok?"correct":"wrong"}">

    <b>${i+1}. ${q.q}</b>

    <p>
     আপনার উত্তর:
     <b>${your===null?"উত্তর দেননি":q.a[your]}</b>
    </p>

    <p>
     সঠিক উত্তর:
     <b>✓ ${q.a[q.ans]}</b>
    </p>

   </div>
  `;

 });

 html+=`

  <br>

  <button class="btn green" onclick="startMock()">
   🔄 আবার Mock Test দিন
  </button>

 </main>`;

 document.getElementById("app").innerHTML=html;
}

 const u=document.getElementById("user").value;
 const p=document.getElementById("pass").value;

 if(u==="admin" && p==="1234"){

  localStorage.setItem("bpLogin","yes");

  alert("Login সফল হয়েছে।");

  updateLogin();
  home();

 }else{
  alert("Username অথবা Password ভুল।");
 }
}


function logout(){

 localStorage.removeItem("bpLogin");

 alert("Logout সফল হয়েছে।");

 updateLogin();
 home();
}


function updateLogin(){

 const logged=localStorage.getItem("bpLogin")==="yes";

 document.getElementById("loginBtn")
  .classList.toggle("hidden",logged);

 document.getElementById("logoutBtn")
  .classList.toggle("hidden",!logged);
}
