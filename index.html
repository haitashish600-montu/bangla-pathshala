<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082f5f">
<title>বাংলা পাঠশালা | আশিষ হাইত</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:"Noto Sans Bengali","Nirmala UI","Hind Siliguri",Arial,sans-serif;
background:#f4f7fb;color:#102d4d;line-height:1.65
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
--nav:#062f5f;
--blue:#087bd3;
--yellow:#ffd21a;
--purple:#7b2ff7;
--green:#16a85a;
--red:#ef3e4a;
--card:#fff;
--muted:#6d7785;
}

/* TOP NAV */
.topbar{
height:64px;background:var(--nav);color:#fff;
position:sticky;top:0;z-index:1000;
box-shadow:0 3px 18px #001d3d44
}
.top-inner{
height:100%;max-width:1500px;margin:auto;
display:flex;align-items:center;justify-content:space-between;
padding:0 18px
}
.brand{font-size:21px;font-weight:900}
.brand span{color:var(--yellow)}
.nav-actions{display:flex;align-items:center;gap:7px}
.nav-actions button{
border:0;background:transparent;color:white;
padding:9px 12px;border-radius:9px;font-weight:700
}
.nav-actions button:hover{background:#ffffff18}
.menu-btn{
font-size:25px!important;background:#ffffff16!important
}
.logout-btn{background:#ef3e4a!important}
.hamburger{
font-size:25px;border:0;background:transparent;color:white
}

/* DRAWER */
.overlay{
position:fixed;inset:0;background:#0008;z-index:1500
}
.drawer{
position:fixed;left:0;top:0;bottom:0;width:min(340px,88vw);
background:white;z-index:1600;
transform:translateX(-105%);transition:.25s;
box-shadow:8px 0 30px #0004;
overflow:auto
}
.drawer.open{transform:translateX(0)}
.drawer-head{
background:linear-gradient(135deg,#062f5f,#0a5da8);
color:white;padding:30px 20px
}
.logo-circle{
width:65px;height:65px;border-radius:50%;
background:#fff2;display:flex;align-items:center;
justify-content:center;font-size:32px;margin-bottom:10px
}
.drawer-head h2{font-size:24px}
.drawer-head p{opacity:.9}
.drawer nav button{
width:100%;text-align:left;border:0;background:white;
padding:14px 20px;font-weight:700;color:#173451;
border-bottom:1px solid #edf0f5
}
.drawer nav button:hover{background:#f0f6ff}
.drawer-contact{
padding:18px;background:#f7f9fc;margin:15px;border-radius:15px
}

/* HOME */
.hero{
position:relative;width:100%;overflow:hidden;background:#082f5f
}
.hero img{
display:block;width:100%;height:auto;max-height:520px;
object-fit:cover
}

/* QUICK CARDS */
.quick-wrap{
max-width:1480px;margin:22px auto;padding:0 22px
}
.quick-grid{
display:grid;grid-template-columns:repeat(3,1fr);gap:20px
}
.quick-card{
background:white;border-radius:20px;min-height:145px;
display:flex;align-items:center;gap:22px;padding:20px;
box-shadow:0 8px 25px #193b5b12;
border-left:7px solid var(--blue);
transition:.2s
}
.quick-card:hover{transform:translateY(-3px)}
.quick-card.orange{border-left-color:#ff9e00}
.quick-card.green{border-left-color:#19ad60}
.quick-card.purple{border-left-color:#8c42dc}
.quick-card.red{border-left-color:#ef4050}
.quick-card .bigicon{font-size:55px;min-width:70px;text-align:center}
.quick-card h2{font-size:25px;color:#082f5f}
.quick-card p{color:#687789;font-size:16px}
.section{
max-width:1480px;margin:30px auto;padding:0 22px
}
.section-title{
font-size:32px;color:#07335e;margin-bottom:8px;
font-weight:900
}
.section-sub{color:#748091;margin-bottom:20px}

/* COURSE CARDS */
.course-grid{
display:grid;grid-template-columns:repeat(4,1fr);gap:20px
}
.course-card{
background:white;border-radius:20px;padding:24px;
box-shadow:0 8px 24px #193b5b13;
border-top:5px solid var(--blue);
cursor:pointer;position:relative;overflow:hidden
}
.course-card:nth-child(2){border-top-color:#65b73a}
.course-card:nth-child(3){border-top-color:#f0a000}
.course-card:nth-child(4){border-top-color:#ef4454}
.course-card .class-icon{
font-size:48px;margin-bottom:10px
}
.course-card h3{font-size:24px}
.course-card p{color:#737f8e}
.badge{
display:inline-block;background:#eaf4ff;color:#1265a3;
padding:4px 10px;border-radius:20px;font-size:13px;
font-weight:700;margin-top:10px
}

/* PAGE */
.page{
max-width:1200px;margin:25px auto;padding:0 18px
}
.back{
border:0;background:#e9f1fa;color:#073e6e;
padding:9px 16px;border-radius:10px;font-weight:800;
margin-bottom:15px
}
.page-head{
background:linear-gradient(135deg,#06386d,#087bd3);
color:white;padding:28px;border-radius:20px;
margin-bottom:20px
}
.page-head h1{font-size:32px}
.page-head p{opacity:.9}

/* CHAPTERS */
.chapter-grid{
display:grid;grid-template-columns:repeat(2,1fr);gap:15px
}
.chapter{
background:white;border-radius:16px;padding:20px;
box-shadow:0 6px 20px #173c5b12;
border-left:5px solid #0b79cf;
cursor:pointer
}
.chapter h3{font-size:21px}
.chapter p{color:#75808c;font-size:14px}
.chapter:hover{background:#f7fbff}

/* CHAPTER PAGE OPTIONS */
.option-grid{
display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
margin:20px 0
}
.option{
background:white;border-radius:17px;padding:20px;
box-shadow:0 7px 20px #173c5b14
}
.option .ico{font-size:35px}
.option h3{margin-top:5px}
.option p{color:#727e8b;font-size:14px;margin-bottom:12px}
.btn{
border:0;background:#7b2ff7;color:white;
padding:9px 16px;border-radius:10px;font-weight:800
}
.btn.blue{background:#087bd3}
.btn.green{background:#16a85a}
.btn.red{background:#ef3e4a}
.btn.dark{background:#07335e}
.btn.light{background:#edf3fa;color:#123d62}

/* CONTENT */
.content-box{
background:white;border-radius:20px;padding:25px;
box-shadow:0 7px 25px #173c5b12;margin-top:18px
}
.content-box h2{font-size:27px;margin-bottom:12px}
.note-text{
font-size:18px;white-space:pre-wrap;
line-height:2;color:#24384d
}

/* MODEL */
.model-list{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.model{
background:white;border-radius:15px;padding:17px 20px;
display:flex;align-items:center;justify-content:space-between;
box-shadow:0 5px 18px #193b5b12
}

/* CONTACT */
.contact-card{
background:white;border-radius:20px;padding:25px;
box-shadow:0 8px 25px #173c5b12
}
.contact-row{
display:flex;gap:15px;flex-wrap:wrap;margin-top:15px
}
.contact-btn{
text-decoration:none;color:white;padding:12px 20px;
border-radius:12px;font-weight:800;display:inline-block
}
.whatsapp{background:#18b957}
.email{background:#7b2ff7}
.phone{background:#087bd3}

/* LOGIN */
.login-screen{
min-height:calc(100vh - 64px);display:flex;
align-items:center;justify-content:center;padding:25px;
background:linear-gradient(135deg,#eef5ff,#f8f0ff)
}
.login-box{
background:white;width:min(460px,100%);padding:35px;
border-radius:25px;box-shadow:0 15px 50px #173c5b25
}
.login-logo{font-size:55px;text-align:center}
.login-box h1{text-align:center;color:#6828c7;font-size:31px}
.login-box .teacher{text-align:center;color:#777;margin-bottom:25px}
.login-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-tabs button{
border:0;padding:12px;border-radius:12px;background:#eee
}
.login-tabs .active{background:#8b35f5;color:white}
.field{
width:100%;padding:14px;border:1px solid #d7dce4;
border-radius:12px;margin-top:12px;outline:0
}
.field:focus{border-color:#7b2ff7}
.login-btn{
width:100%;margin-top:15px;padding:14px;
border:0;border-radius:12px;background:#8434f5;color:white;
font-size:18px;font-weight:900
}
.demo{
background:#f5f7fb;padding:12px;border-radius:12px;
margin-top:15px;font-size:14px;color:#617082
}

/* MCQ */
.quiz-question{
font-size:21px;font-weight:800;margin-bottom:18px
}
.answers{display:grid;gap:10px}
.answer{
padding:13px 16px;border:1px solid #dce2e9;
background:white;border-radius:12px;text-align:left
}
.answer:hover{background:#f4f8ff}
.answer.selected{background:#e9f1ff;border-color:#087bd3}
.answer.correct{background:#dff8e9;border-color:#16a85a}
.answer.wrong{background:#ffe2e2;border-color:#ef3e4a}
.result{
padding:18px;background:#f3f7fb;border-radius:15px;
margin-top:20px
}
.result strong{font-size:25px}

/* ADMIN */
.admin-box{
background:#fff;border-radius:20px;padding:25px;
box-shadow:0 8px 25px #173c5b12
}
textarea.field{min-height:130px;resize:vertical}
.admin-item{
padding:12px;background:#f6f8fb;border-radius:10px;
margin-top:10px
}

/* BOTTOM NAV */
.bottom-nav{
position:sticky;bottom:0;z-index:900;
background:white;border-top:1px solid #e1e6ed;
display:flex;justify-content:center;gap:50px;
padding:9px 10px;box-shadow:0 -4px 20px #173c5b12
}
.bottom-nav button{
border:0;background:white;color:#183b5c;
display:flex;flex-direction:column;align-items:center;
font-size:13px;font-weight:700
}
.bottom-nav .bico{font-size:25px}
.bottom-nav button.active{color:#073d88}

/* FOOTER */
footer{
background:#062f5f;color:white;text-align:center;
padding:25px;margin-top:35px
}

/* RESPONSIVE */
@media(max-width:950px){
.quick-grid{grid-template-columns:repeat(2,1fr)}
.course-grid{grid-template-columns:repeat(2,1fr)}
.option-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
.topbar{height:56px}
.brand{font-size:16px}
.nav-actions button:not(.menu-btn){display:none}
.hero img{min-height:190px;object-fit:cover}
.quick-wrap,.section{padding:0 12px}
.quick-grid{grid-template-columns:1fr}
.quick-card{min-height:115px;padding:15px}
.quick-card .bigicon{font-size:42px;min-width:55px}
.quick-card h2{font-size:21px}
.quick-card p{font-size:14px}
.section-title{font-size:26px}
.course-grid{grid-template-columns:1fr 1fr;gap:10px}
.course-card{padding:15px}
.course-card h3{font-size:19px}
.course-card .class-icon{font-size:36px}
.chapter-grid{grid-template-columns:1fr}
.option-grid{grid-template-columns:1fr 1fr}
.option{padding:15px}
.option .ico{font-size:28px}
.option h3{font-size:17px}
.model-list{grid-template-columns:1fr}
.page-head h1{font-size:25px}
.note-text{font-size:17px}
.bottom-nav{gap:18px}
.bottom-nav .bico{font-size:22px}
.login-box{padding:25px}
}
</style>
</head>

function closeMenu(){
document.getElementById("drawer").classList.remove("open");
document.getElementById("overlay").classList.add("hidden");
}

function openMenu(){
document.getElementById("drawer").classList.add("open");
document.getElementById("overlay").classList.remove("hidden");
}

function setPage(html){
closeMenu();
app().innerHTML=html;
window.scrollTo(0,0);
}

function goHome(){
setPage(homeHTML());
}

function isLogged(){
return localStorage.getItem("bp_logged_in")==="1";
}

function updateLoginButton(){
const b=document.getElementById("logoutTop");
if(b)b.classList.toggle("hidden",!isLogged());
}

function showClass(id){
const c=DATA.classes[id];

setPage(`
<section class="page">
<button class="back" onclick="showCourses()">← সব কোর্স</button>

<div class="page-head">
<h1>${c.name}</h1>
<p>${c.desc}</p>
</div>

<div class="chapter-grid">
${c.chapters.map((x,i)=>`
<div class="chapter" onclick="openChapter('${id}','${x.type}',${i})">
<h3>📖 ${x.title}</h3>
<p>${x.desc}</p>
</div>
`).join("")}
</div>

${id==="9"?`
<div class="content-box">
<h2>✍️ নবম শ্রেণির নির্মিতি</h2>
${DATA.nirmiti9.map(x=>`<div class="chapter" style="margin-top:10px"><h3>${x}</h3></div>`).join("")}
</div>`:""}

${id==="10"?`
<div class="content-box">
<h2>✍️ দশম শ্রেণির নির্মিতি</h2>
${DATA.nirmiti10.map(x=>`<div class="chapter" style="margin-top:10px"><h3>${x}</h3></div>`).join("")}
</div>`:""}

</section>
`);
}
