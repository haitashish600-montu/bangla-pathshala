<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#062f5f">
<title>বাংলা পাঠশালা | আশিষ হাইত</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:"Noto Sans Bengali","Nirmala UI","Hind Siliguri",Arial,sans-serif;
background:#f4f7fb;color:#142d48;line-height:1.65;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}

:root{
--nav:#062f5f;
--blue:#087bd3;
--yellow:#ffd21a;
--purple:#7b2ff7;
--green:#19a85a;
--red:#ef3e4a;
--card:#fff;
--muted:#697785;
}

/* TOP NAV */
.topbar{
height:64px;background:var(--nav);color:white;
position:sticky;top:0;z-index:1000;
box-shadow:0 3px 15px #001d3d44;
}
.topinner{
max-width:1500px;height:100%;margin:auto;
display:flex;align-items:center;gap:12px;padding:0 14px;
}
.brand{
font-size:21px;font-weight:900;white-space:nowrap;
}
.brand span{color:var(--yellow)}
.menuBtn{
width:45px;height:45px;border:0;border-radius:12px;
background:#ffffff18;color:white;font-size:27px;
margin-left:auto;
}
.navlinks{display:flex;gap:5px;align-items:center}
.navlinks button{
border:0;background:transparent;color:#fff;
padding:9px 12px;border-radius:9px;font-weight:700;
}
.navlinks button:hover{background:#ffffff18}
.loginBtn{background:#18a85b!important}
.logoutBtn{background:#ef3e4a!important}

@media(max-width:700px){
.topbar{height:58px}
.brand{font-size:16px}
.navlinks{display:none}
.menuBtn{margin-left:auto}
}

/* DRAWER */
.overlay{
position:fixed;inset:0;background:#0008;
z-index:1500;display:none;
}
.overlay.show{display:block}
.drawer{
position:fixed;left:0;top:0;bottom:0;width:330px;
max-width:88vw;background:#fff;z-index:1600;
transform:translateX(-105%);transition:.25s;
box-shadow:8px 0 30px #0005;overflow:auto;
}
.drawer.open{transform:translateX(0)}
.drawerHead{
background:linear-gradient(135deg,#062f5f,#075da8);
color:white;padding:25px 20px;
}
.closeDrawer{
float:right;background:#ffffff22;color:#fff;
border:0;border-radius:8px;font-size:22px;padding:4px 10px;
}
.logoCircle{
width:65px;height:65px;border-radius:50%;
background:#fff;display:flex;align-items:center;
justify-content:center;font-size:35px;margin-bottom:10px;
}
.drawerHead h2{font-size:23px}
.drawerHead p{opacity:.9}
.drawer nav{padding:12px}
.drawer nav button{
width:100%;text-align:left;border:0;background:#fff;
padding:13px 12px;border-radius:10px;font-weight:700;
color:#18344e;margin:3px 0;
}
.drawer nav button:hover{background:#eef5ff}
.drawerContact{
margin:14px;padding:15px;background:#f4f8ff;
border-radius:12px;font-size:14px;
}

/* HERO */
.hero{
position:relative;width:100%;overflow:hidden;
background:#062f5f;
}
.hero img{
display:block;width:100%;height:auto;
max-height:520px;object-fit:cover;
}
.heroFallback{
display:none;min-height:260px;
background:linear-gradient(135deg,#062f5f,#0a5ba8);
color:white;align-items:center;justify-content:center;
text-align:center;padding:40px;
}
.heroFallback h1{font-size:45px}
.heroFallback span{color:#ffd21a}

/* NOTICE */
.notice{
background:#fff;margin:10px auto;padding:10px 15px;
border-radius:14px;max-width:1500px;
box-shadow:0 3px 15px #1231;
overflow:hidden;white-space:nowrap;
}
.notice b{color:#e9a400}

/* CONTAINER */
.container{
max-width:1500px;margin:auto;padding:18px 20px 50px;
}
.sectionTitle{
font-size:30px;font-weight:900;color:#073963;
margin:28px 0 5px;
}
.sectionSub{color:#718091;margin-bottom:16px}

/* QUICK GRID */
.quickGrid{
display:grid;grid-template-columns:repeat(3,1fr);
gap:18px;margin-bottom:28px;
}
.quickCard{
background:#fff;border-radius:18px;padding:22px;
min-height:120px;display:flex;align-items:center;
gap:20px;box-shadow:0 5px 20px #173b5c12;
border-left:6px solid var(--blue);
transition:.2s;
}
.quickCard:hover{transform:translateY(-3px)}
.quickIcon{font-size:50px}
.quickCard h3{font-size:22px}
.quickCard p{color:#718091}
.quickCard:nth-child(2){border-color:#ff9e00}
.quickCard:nth-child(3){border-color:#1caf61}
.quickCard:nth-child(4){border-color:#853be4}
.quickCard:nth-child(5){border-color:#ef3e4a}
.quickCard:nth-child(6){border-color:#0754b9}

@media(max-width:850px){
.quickGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.container{padding:12px 12px 40px}
.quickGrid{grid-template-columns:1fr 1fr;gap:12px}
.quickCard{padding:15px;min-height:105px;gap:10px}
.quickIcon{font-size:32px}
.quickCard h3{font-size:17px}
.quickCard p{font-size:12px}
.sectionTitle{font-size:24px}
}

/* CLASS CARDS */
.classGrid{
display:grid;grid-template-columns:repeat(4,1fr);
gap:18px;
}
.classCard{
background:white;border-radius:20px;padding:24px;
min-height:190px;position:relative;
box-shadow:0 5px 20px #173b5c12;
border:1px solid #e8edf3;
overflow:hidden;
cursor:pointer;
}
.classCard:after{
content:"";position:absolute;width:75px;height:75px;
right:-12px;top:-12px;background:#ffe77a;
border-radius:50%;
opacity:.65;
}
.classNumber{
width:55px;height:55px;border-radius:10px;
background:#e5f2ff;display:flex;align-items:center;
justify-content:center;font-size:30px;font-weight:900;
color:#075da8;margin-bottom:12px;
}
.classCard:nth-child(2) .classNumber{background:#fff1c9}
.classCard:nth-child(3) .classNumber{background:#eee5ff}
.classCard:nth-child(4) .classNumber{background:#dff8ec}
.classCard h3{font-size:22px}
.classCard p{color:#718091;font-size:14px}
.badge{
display:inline-block;margin-top:10px;padding:4px 10px;
border-radius:20px;background:#eaf5ff;color:#075da8;
font-size:12px;font-weight:800;
}

@media(max-width:850px){
.classGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
.classGrid{grid-template-columns:1fr 1fr;gap:12px}
.classCard{padding:15px;min-height:165px}
.classCard h3{font-size:18px}
}

/* MODEL SET */
.modelGrid{
display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.modelItem{
background:#fff;border-radius:14px;padding:15px 18px;
display:flex;justify-content:space-between;align-items:center;
box-shadow:0 4px 15px #173b5c10;
cursor:pointer;
}
.modelItem:hover{background:#f6fbff}
.mark{
background:#fff0ad;color:#775c00;
border-radius:20px;padding:5px 12px;font-weight:900;
white-space:nowrap;
}
@media(max-width:600px){
.modelGrid{grid-template-columns:1fr}
}

/* STUDY */
.studyBox{
background:linear-gradient(135deg,#075da8,#0069bd);
border-radius:20px;padding:20px;color:#fff;
}
.studyItem{
background:#ffffff15;border:1px solid #ffffff22;
padding:15px;border-radius:12px;margin:9px 0;
display:flex;justify-content:space-between;align-items:center;
}
.studyItem button{
border:0;background:#ffffff18;color:#fff;
padding:7px 13px;border-radius:8px;
}

/* CONTACT */
.contactCard{
background:#fff;border-radius:18px;padding:22px;
box-shadow:0 5px 20px #173b5c12;
}
.contactBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.contactBtns a{
padding:10px 16px;border-radius:10px;
font-weight:800;color:#fff;
}
.whatsapp{background:#16c86b}
.email{background:#2463d6}
.phone{background:#ef3e4a}

/* PAGE */
.page{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.pageHead{
display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.back{
border:0;background:#e7f1fb;color:#075da8;
padding:8px 14px;border-radius:10px;font-weight:800;
}
.pageHead h1{font-size:31px}
.chapterGrid{
display:grid;grid-template-columns:repeat(2,1fr);gap:15px;
}
.chapter{
background:#fff;padding:20px;border-radius:16px;
box-shadow:0 4px 18px #173b5c12;
cursor:pointer;border-left:5px solid #087bd3;
}
.chapter:hover{transform:translateY(-2px)}
.chapter h3{font-size:20px}
.chapter p{color:#718091;font-size:14px}
@media(max-width:600px){
.chapterGrid{grid-template-columns:1fr}
.pageHead h1{font-size:24px}
}

/* CHAPTER PAGE */
.chapterHero{
background:linear-gradient(135deg,#062f5f,#087bd3);
color:#fff;border-radius:20px;padding:25px;
margin-bottom:18px;
}
.chapterHero h1{font-size:30px}
.options{
display:grid;grid-template-columns:repeat(3,1fr);gap:15px;
}
.option{
background:#fff;border-radius:18px;padding:20px;
box-shadow:0 5px 20px #173b5c12;
}
.option .ico{font-size:34px}
.option h3{font-size:20px}
.option small{color:#718091}
.btn{
border:0;background:#7b2ff7;color:#fff;
padding:9px 14px;border-radius:9px;font-weight:800;
margin-top:10px;
}
.btn.blue{background:#087bd3}
.btn.green{background:#19a85a}
.btn.red{background:#ef3e4a}
@media(max-width:700px){
.options{grid-template-columns:1fr}
}

/* COLLEGE */
.collegeGrid{
display:grid;grid-template-columns:repeat(2,1fr);gap:15px;
}
.collegeCard{
background:#fff;border-radius:17px;padding:20px;
box-shadow:0 4px 16px #173b5c12;
}
.collegeCard h3{font-size:21px}
@media(max-width:600px){
.collegeGrid{grid-template-columns:1fr}
}

/* TEST */
.testBox{
background:#fff;border-radius:20px;padding:22px;
box-shadow:0 5px 20px #173b5c12;
}
.testTop{
display:flex;justify-content:space-between;gap:10px;
align-items:center;border-bottom:1px solid #e8edf3;
padding-bottom:12px;margin-bottom:15px;
}
.question{
padding:18px;background:#f8fbff;border-radius:14px;
margin-bottom:14px;
}
.question h3{font-size:18px;margin-bottom:10px}
.answers label{
display:block;background:#fff;border:1px solid #dfe7ef;
padding:10px;border-radius:9px;margin:7px 0;
cursor:pointer;
}
.answers label:hover{background:#eef7ff}
.result{
padding:18px;border-radius:15px;background:#eef9f2;
margin-top:15px;
}
.correct{color:#108348;font-weight:900}
.wrong{color:#d62839;font-weight:900}
.answerReview{
margin-top:8px;padding:10px;background:#fff;
border-radius:10px;
}

/* LOGIN */
.loginWrap{
min-height:65vh;display:flex;align-items:center;
justify-content:center;padding:30px;
}
.loginCard{
background:#fff;width:100%;max-width:430px;
border-radius:22px;padding:30px;
box-shadow:0 8px 35px #173b5c18;
}
.loginCard h1{font-size:30px;text-align:center}
.input{
width:100%;padding:13px;border:1px solid #d8e0e8;
border-radius:10px;margin:7px 0 13px;
outline:none;
}
.input:focus{border-color:#087bd3}
.loginDemo{
background:#f2f7fd;padding:12px;border-radius:10px;
font-size:13px;margin-top:15px;
}

/* PROFILE */
.profile{
background:#fff;border-radius:18px;padding:20px;
box-shadow:0 5px 20px #173b5c12;
}

/* FOOTER */
footer{
background:#062f5f;color:#dceaff;
padding:25px;text-align:center;margin-top:30px;

/* COPY PROTECTION */

user-select:none;
-webkit-user-select:none;
}

/* =========================================================
   AUTH
========================================================= */

function isLogged(){
return localStorage.getItem("bp_logged")==="1";
}

function loginUser(){
const u=document.getElementById("loginUser").value.trim();
const p=document.getElementById("loginPass").value;

if(u===DEMO.username && p===DEMO.password){
localStorage.setItem("bp_logged","1");
localStorage.setItem("bp_user","Student");
home();
}else{
document.getElementById("loginError").textContent=
"Username অথবা Password সঠিক নয়।";
}
}

function logout(){
localStorage.removeItem("bp_logged");
localStorage.removeItem("bp_user");
home();
}


/* =========================================================
   NAVIGATION
========================================================= */

function openDrawer(){
document.getElementById("drawer").classList.add("open");
document.getElementById("overlay").classList.add("show");
}

function closeDrawer(){
document.getElementById("drawer").classList.remove("open");
document.getElementById("overlay").classList.remove("show");
}

function setPage(html){
document.getElementById("app").innerHTML=html;
window.scrollTo({top:0,behavior:"smooth"});
updateAuth();
}

function updateAuth(){

let html="";

if(isLogged()){
html=
`<button class="logoutBtn" onclick="logout()">Logout</button>`;
}else{
html=
`<button class="loginBtn" onclick="showLogin()">Login</button>`;
}

document.getElementById("authNav").innerHTML=html;

document.getElementById("drawerAuth").innerHTML=isLogged()
?
`<button onclick="logout();closeDrawer()">🚪 Logout</button>`
:
`<button onclick="showLogin();closeDrawer()">🔐 Login</button>`;
}
