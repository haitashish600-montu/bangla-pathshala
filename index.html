<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#062f5f">
<title>বাংলা পাঠশালা | শিক্ষক : আশিস হাইত</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:#f3f6fb;
 color:#102a43;
 font-family:"Noto Sans Bengali","Nirmala UI",Arial,sans-serif;
 line-height:1.6;
 user-select:none;
 -webkit-user-select:none;
}
button,a{font-family:inherit}
button{cursor:pointer}

.topbar{
 position:sticky;
 top:0;
 z-index:1000;
 background:#062f5f;
 color:#fff;
 box-shadow:0 3px 12px #0003;
}
.nav{
 max-width:1200px;
 margin:auto;
 min-height:62px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:8px 14px;
}
.menuBtn{
 width:44px;
 height:44px;
 border:0;
 border-radius:12px;
 background:#124b83;
 color:#fff;
 font-size:25px;
}
.logo{
 font-size:20px;
 font-weight:900;
 margin-right:auto;
 white-space:nowrap;
}
.logo span{color:#ffd21a}

.navlinks{
 display:flex;
 gap:7px;
 align-items:center;
}
.navlinks button{
 border:0;
 background:#124b83;
 color:#fff;
 padding:9px 13px;
 border-radius:10px;
 font-weight:700;
}
.navlinks button:hover{background:#1b619f}

.loginBtn{
 background:#00c889!important;
 min-width:75px;
}
.logoutBtn{background:#e53935!important}

.container{
 width:min(1200px,94%);
 margin:auto;
}

.hero{
 margin:18px auto 14px;
 border-radius:0 0 35px 35px;
 overflow:hidden;
 background:#063b73;
 box-shadow:0 5px 18px #0002;
}
.hero img{
 display:block;
 width:100%;
 height:auto;
 min-height:180px;
 object-fit:cover;
}

.notice{
 background:#fff;
 border-left:6px solid #9c27d8;
 border-radius:15px;
 padding:14px 18px;
 margin:15px 0 24px;
 box-shadow:0 3px 12px #0001;
 font-size:16px;
}
.notice b{font-size:18px}

.sectionTitle{
 font-size:27px;
 margin:20px 0 4px;
 font-weight:900;
}
.sectionSub{
 margin:0 0 15px;
 color:#667788;
}

.quickGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}
.quickCard{
 background:#fff;
 border-radius:18px;
 padding:17px;
 min-height:120px;
 box-shadow:0 4px 14px #0001;
 border-left:7px solid #087bd3;
 transition:.2s;
}
.quickCard:hover{
 transform:translateY(-2px);
 box-shadow:0 8px 18px #0002;
}
.quickCard:nth-child(2){border-color:#ffae00}
.quickCard:nth-child(3){border-color:#10ad73}
.quickCard:nth-child(4){border-color:#8b2bd9}
.quickCard:nth-child(5){border-color:#ef3340}
.quickCard:nth-child(6){border-color:#087bd3}
.quickIcon{font-size:29px}
.quickCard h3{
 margin:2px 0;
 font-size:21px;
}
.quickCard p{
 margin:0;
 color:#718096;
}

.classGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}
.classCard{
 background:#fff;
 border-radius:17px;
 padding:18px;
 box-shadow:0 3px 13px #0001;
 border-top:5px solid #087bd3;
}
.classCard h3{margin:0 0 5px}
.classCard p{margin:0;color:#667788}
.classCard button{margin-top:12px}

.modelGrid,.noticeGrid,.linkGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}

.card{
 background:#fff;
 padding:18px;
 border-radius:17px;
 box-shadow:0 3px 13px #0001;
}
.card h3{margin-top:0}

.btn{
 border:0;
 border-radius:10px;
 padding:10px 16px;
 background:#087bd3;
 color:white;
 font-weight:800;
}
.btn.green{background:#0aa56f}
.btn.red{background:#e53935}
.btn.dark{background:#26374a}
.btn.yellow{background:#e59b00}

.page{
 padding:20px 0 50px;
}
.pageHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:18px;
}
.pageHead h1{margin:0}

.back{
 border:0;
 background:#062f5f;
 color:#fff;
 border-radius:10px;
 padding:10px 15px;
 font-weight:800;
}

.chapterGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}
.chapter{
 background:#fff;
 border-radius:16px;
 padding:17px;
 box-shadow:0 3px 13px #0001;
 cursor:pointer;
 border-left:5px solid #087bd3;
}
.chapter:hover{background:#f9fbff}
.chapter h3{margin:0}
.chapter p{margin:3px 0;color:#667788}

.optionGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.option{
 background:#fff;
 border-radius:17px;
 padding:18px;
 box-shadow:0 3px 13px #0001;
}
.optionIcon{font-size:30px}

.empty{
 background:#fff;
 border-radius:16px;
 padding:25px;
 text-align:center;
 color:#687889;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:5000;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal.show{display:flex}
.modalBox{
 background:#fff;
 width:min(650px,96%);
 max-height:90vh;
 overflow:auto;
 border-radius:20px;
 padding:20px;
 position:relative;
}
.close{
 position:absolute;
 right:12px;
 top:10px;
 border:0;
 background:#eee;
 width:38px;
 height:38px;
 border-radius:50%;
 font-size:22px;
}
.modalHead{
 padding-right:45px;
 border-bottom:1px solid #ddd;
 margin-bottom:15px;
}
.modalHead h2{margin:0}

.input{
 width:100%;
 padding:12px;
 border:1px solid #ccd5df;
 border-radius:10px;
 margin:6px 0 12px;
 font-size:16px;
}

.videoBox{
 position:relative;
 padding-top:56.25%;
 margin-top:12px;
}
.videoBox iframe{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 border:0;
 border-radius:12px;
}

.bottomNav{
 position:sticky;
 bottom:0;
 z-index:900;
 background:#fff;
 box-shadow:0 -3px 15px #0002;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 padding:7px 4px;
 margin-top:25px;
}
.bottomNav button{
 border:0;
 background:transparent;
 color:#102a43;
 padding:6px 2px;
 font-weight:700;
}
.bottomNav .ico{font-size:24px;display:block}
.bottomNav button.active{color:#064fb4}

footer{
 background:#063b73;
 color:#fff;
 text-align:center;
 padding:18px;
 margin-top:0;
}

.drawer{
 position:fixed;
 top:0;
 left:-310px;
 width:290px;
 height:100%;
 background:#fff;
 z-index:3000;
 box-shadow:5px 0 20px #0003;
 transition:.25s;
 padding:20px;
}
.drawer.open{left:0}
.drawer h2{margin-top:0;color:#062f5f}
.drawer button{
 display:block;
 width:100%;
 text-align:left;
 border:0;
 background:#f3f6fb;
 padding:12px;
 margin:7px 0;
 border-radius:10px;
 font-weight:700;
}
.drawerOverlay{
 position:fixed;
 inset:0;
 background:#0006;
 z-index:2500;
 display:none;
}
.drawerOverlay.show{display:block}

.answer{
 background:#fff9df;
 border-left:5px solid #ffb000;
 padding:14px;
 border-radius:10px;
 margin-top:12px;
}
.answerTitle{font-weight:900}

@media(max-width:900px){
 .quickGrid{grid-template-columns:repeat(2,1fr)}
 .classGrid{grid-template-columns:repeat(2,1fr)}
 .optionGrid{grid-template-columns:1fr}
 .navlinks{display:none}
 .menuBtn{order:-1}
}
@media(max-width:560px){
 .container{width:94%}
 .hero{margin-top:10px;border-radius:0 0 30px 30px}
 .quickGrid{grid-template-columns:repeat(2,1fr);gap:9px}
 .quickCard{padding:13px;min-height:112px}
 .quickCard h3{font-size:18px}
 .quickCard p{font-size:14px}
 .quickIcon{font-size:24px}
 .classGrid,.chapterGrid,.modelGrid,.noticeGrid,.linkGrid{
  grid-template-columns:1fr;
 }
 .sectionTitle{font-size:24px}
 .logo{font-size:17px}
 .nav{padding:7px}
}
</style>
</head>

<body oncontextmenu="return false">

<div class="topbar">
 <div class="nav">
  <button class="menuBtn" onclick="openDrawer()">☰</button>

  <div class="logo">বাংলা <span>পাঠশালা</span></div>

  <nav class="navlinks">
   <button onclick="home()">হোম</button>
   <button onclick="showPage('courses')">কোর্স</button>
   <button onclick="showPage('models')">মডেল সেট</button>
   <button onclick="showPage('notice')">নোটিশ</button>

  <button id="loginBtn" class="loginBtn btn" onclick="login()">Login</button>
 </div>
</div>

<div id="drawerOverlay" class="drawerOverlay" onclick="closeDrawer()"></div>

<aside id="drawer" class="drawer">
 <button onclick="closeDrawer()">✕ মেনু বন্ধ করুন</button>
 <h2>বাংলা পাঠশালা</h2>
 <button onclick="home()">🏠 Home</button>
 <button onclick="showPage('courses')">📚 All Courses</button>
 <button onclick="showPage('notice')">📢 Notice Board</button>
 <button onclick="showPage('freeclass')">💻 Free Class</button>
 <button onclick="showPage('test')">📝 Free MCQ Test</button>
 <button onclick="showPage('pdf')">📄 Free PDF</button>
 <button onclick="showPage('links')">🔗 Important Links</button>
 <button onclick="showPage('models')">📑 Model Set</button>
 <button onclick="showPage('help')">❓ Help</button>
 <button onclick="showPage('mycourses')">📖 My Courses</button>
 <button onclick="showPage('college')">🎓 College</button>
 <button onclick="login()">🔐 Login / Logout</button>
</aside>

<main id="app"></main>

<div id="modal" class="modal">
 <div id="modalBox" class="modalBox"></div>
</div>

<footer>
 © 2026 বাংলা পাঠশালা | শিক্ষক : আশিস হাইত
</footer>

/* =========================================================
   BASIC NAVIGATION
   ========================================================= */

function home(){
 closeDrawer();

 let html=`
 <div class="container">

  <section class="hero">
   <img src="banner.png"
        alt="বাংলা পাঠশালা ব্যানার"
        onerror="this.style.display='none'">
  </section>

  <div class="notice" onclick="showPage('notice')">
   📢 <b>নোটিশ:</b>
   পরীক্ষার রুটিন ও গুরুত্বপূর্ণ আপডেট দেখতে Notice Board দেখুন।
  </div>

  <h2 class="sectionTitle">🚀 দ্রুত প্রবেশ</h2>

  <div class="quickGrid">

   ${quickCard("📚","All Courses","সমস্ত কোর্স দেখুন","showPage('courses')")}

   ${quickCard("📢","Notice Board","নোটিশ দেখুন","showPage('notice')")}

   ${quickCard("💻","Free Class","ফ্রি ক্লাস দেখুন","showPage('freeclass')")}

   ${quickCard("📝","Free MCQ Test","ফ্রি MCQ টেস্ট দিন","showPage('test')")}

   ${quickCard("📄","Free PDF","Study Material দেখুন","showPage('pdf')")}

   ${quickCard("🔗","Important Links","গুরুত্বপূর্ণ লিংকসমূহ","showPage('links')")}

  </div>

  <h2 class="sectionTitle">📚 শ্রেণি অনুযায়ী পড়াশোনা</h2>
  <p class="sectionSub">আপনার শ্রেণি নির্বাচন করে বাংলা বিষয়ের প্রস্তুতি নিন।</p>

  <div class="classGrid">
   ${Object.entries(DATA.classes).map(([id,c])=>`
    <div class="classCard">
     <h3>${esc(c.name)}</h3>
     <p>${esc(c.desc)}</p>
     <button class="btn" onclick="openClass('${id}')">প্রবেশ করুন</button>
    </div>
   `).join("")}
  </div>

  <h2 class="sectionTitle">📝 গুরুত্বপূর্ণ Model Set</h2>

  <div class="modelGrid">
   ${DATA.models.map((m,i)=>`
    <div class="card">
     <h3>📑 ${esc(m.title)}</h3>
     <p>${esc(m.text)}</p>
     ${m.link
       ? `<a class="btn" href="${escAttr(m.link)}" target="_blank">দেখুন</a>`

    </div>
   `).join("")}

}


/* QUICK CARD */

function quickCard(icon,title,text,action){
 return `
 <div class="quickCard" onclick="${action}">
  <div class="quickIcon">${icon}</div>
  <h3>${title}</h3>
  <p>${text}</p>
 </div>`;
}


/* =========================================================
   COURSES
   ========================================================= */

function openClass(id){
 closeDrawer();

 const c=DATA.classes[id];

 let html=`
 <div class="container page">

  <div class="pageHead">
   <div>
    <h1>${esc(c.name)}</h1>
    <p>${esc(c.desc)}</p>
   </div>
   <button class="back" onclick="showPage('courses')">← সব কোর্স</button>
  </div>

  <div class="chapterGrid">
   ${c.chapters.map((ch,i)=>`
    <div class="chapter"
         onclick="openChapter('${id}',${i})">
     <h3>📖 ${esc(ch.title)}</h3>
     <p>${esc(ch.desc)}</p>
    </div>
   `).join("")}
  </div>

 </div>`;

 document.getElementById("app").innerHTML=html;
 window.scrollTo(0,0);
}


function showPage(page){

 closeDrawer();

 if(page==="courses"){
  renderCourses();
  return;
 }

 if(page==="notice"){
  renderNotice();
  return;
 }

 if(page==="freeclass"){
  renderFreeClass();
  return;
 }

 if(page==="test"){
  renderTest();
  return;
 }

 if(page==="pdf"){
  renderPDF();
  return;
 }

 if(page==="links"){
  renderLinks();
  return;
 }

 if(page==="models"){
  renderModels();
  return;
 }

 if(page==="help"){
  renderHelp();
  return;
 }

 if(page==="mycourses"){
  renderMyCourses();
  return;
 }

 if(page==="college"){
  renderCollege();
  return;
 }

 home();
}


function renderCourses(){

 let html=`
 <div class="container page">

  <div class="pageHead">
   <div>
    <h1>📚 All Courses</h1>
    <p>সমস্ত কোর্স দেখুন এবং অধ্যায় নির্বাচন করুন।</p>
   </div>
   <button class="back" onclick="home()">← Home</button>
  </div>

  <div class="classGrid">
   ${Object.entries(DATA.classes).map(([id,c])=>`
    <div class="classCard">
     <h3>${esc(c.name)}</h3>
     <p>${esc(c.desc)}</p>
     <button class="btn" onclick="openClass('${id}')">কোর্স খুলুন</button>
    </div>
   `).join("")}
  </div>

 </div>`;

 document.getElementById("app").innerHTML=html;
 window.scrollTo(0,0);
}


/* =========================================================
   CHAPTER
   ========================================================= */

function openChapter(classId,index){

 const c=DATA.classes[classId];
 const ch=c.chapters[index];

 let html=`
 <div class="container page">

  <div class="pageHead">
   <div>
    <h1>📖 ${esc(ch.title)}</h1>
    <p>${esc(c.name)}</p>
   </div>

   <button class="back" onclick="openClass('${classId}')">
    ← অধ্যায়
   </button>
  </div>

  <div class="optionGrid">

   <div class="option">
    <div class="optionIcon">📒</div>
    <h3>Notes</h3>

/* =========================================================
   LOGIN / LOGOUT
   ========================================================= */

function login(){

 closeDrawer();

 const logged=localStorage.getItem("bp_logged");

 if(logged==="1"){
  openModal(`
   <div class="modalHead">
    <h2>👤 Account</h2>
   </div>

   <p>আপনি বর্তমানে Login করা অবস্থায় আছেন।</p>

   <button class="btn red" onclick="logout()">
    Logout
   </button>
  `);
  return;
 }

 openModal(`
  <div class="modalHead">
   <h2>🔐 Login</h2>
  </div>

  <label>নাম / মোবাইল</label>
  <input id="loginName"
         class="input"
         placeholder="আপনার নাম লিখুন">

  <label>Password</label>
  <input id="loginPassword"
         class="input"
         type="password"
         placeholder="Password">

  <button class="btn green" onclick="doLogin()">
   Login
  </button>

  <p style="color:#667788;font-size:13px">
   এটি অ্যাপের local login system।
  </p>
 `);
}


function doLogin(){

 const name=document.getElementById("loginName").value.trim();

 if(!name){
  alert("নাম লিখুন।");
  return;
 }

 localStorage.setItem("bp_logged","1");
 localStorage.setItem("bp_name",name);

 updateLoginButton();
 closeModal();

 alert("Login সফল হয়েছে।");
}


function logout(){

 localStorage.removeItem("bp_logged");
 localStorage.removeItem("bp_name");

 updateLoginButton();
 closeModal();

 alert("Logout হয়েছে।");
}


function updateLoginButton(){

 const btn=document.getElementById("loginBtn");

 if(!btn)return;

 if(localStorage.getItem("bp_logged")==="1"){
  btn.textContent="Logout";
  btn.classList.remove("loginBtn");
  btn.classList.add("logoutBtn");
 }else{
  btn.textContent="Login";
  btn.classList.remove("logoutBtn");
  btn.classList.add("loginBtn");
 }
}

}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(content){

 document.getElementById("modalBox").innerHTML=`
  <button class="close" onclick="closeModal()">×</button>
  ${content}
 `;

 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
 document.getElementById("modalBox").innerHTML="";
}

document.getElementById("modal").addEventListener("click",function(e){
 if(e.target===this)closeModal();
});


/* =========================================================
   SECURITY / SCREENSHOT DETERRENTS
   ========================================================= */

document.addEventListener("contextmenu",function(e){
 e.preventDefault();
});

document.addEventListener("selectstart",function(e){
 e.preventDefault();
});

document.addEventListener("dragstart",function(e){
 e.preventDefault();
});

document.addEventListener("keydown",function(e){

 if(
  e.key==="F12" ||
  (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) ||
  (e.ctrlKey && ["U","S","P"].includes(e.key.toUpperCase()))
 ){
  e.preventDefault();
 }

});


/* =========================================================
   SAFE TEXT
   ========================================================= */

function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escAttr(value){
 return esc(value).replace(/`/g,"&#096;");
}
