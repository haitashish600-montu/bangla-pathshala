<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>বাংলা পাঠশালা — আশিস হাইত</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --nav:#063b73;
 --blue:#0879d9;
 --purple:#8e20df;
 --green:#06b878;
 --orange:#f2a500;
 --red:#ef3340;
 --cyan:#12a9b6;
 --bg:#f3f7ff;
 --ink:#092f50;
 --muted:#718093;
 --shadow:0 7px 22px rgba(9,47,80,.10)
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font:15px/1.55 "Noto Sans Bengali",sans-serif
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}

.top{
 position:sticky;
 top:0;
 z-index:20;
 height:64px;
 background:var(--nav);
 color:#fff;
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px 12px;
 box-shadow:0 3px 14px #0003
}

.menu{
 width:46px;
 height:46px;
 border-radius:15px;
 background:#07528f;
 color:#fff;
 border:1px solid #1688df;
 font-size:25px
}

.brand{
 font-size:21px;
 font-weight:800;
 flex:1
}

.brand span{color:#ffd500}

.loginTop,.primary{
 background:#00c98b;
 color:#fff;
 font-weight:800;
 border-radius:13px;
 padding:10px 15px
}

main{
 max-width:1000px;
 margin:auto;
 padding:10px 14px 90px
}

/* BANNER */
.banner{
 background:#073b73;
 border-radius:25px;
 overflow:hidden;
 margin:4px 0 14px;
 box-shadow:var(--shadow)
}

.banner img{
 width:100%;
 height:auto;
 display:block;
 object-fit:contain
}

/* NOTICE */
.notice{
 background:#fff;
 border-radius:22px;
 border-left:6px solid var(--purple);
 padding:13px 15px;
 display:flex;
 gap:9px;
 align-items:center;
 margin-bottom:20px;
 box-shadow:var(--shadow)
}

.notice .grow{flex:1}
.notice strong{font-size:16px}

.pill{
 background:var(--purple);
 color:#fff;
 border-radius:11px;
 padding:9px 13px;
 font-weight:700
}

/* TITLES */
.title{
 font-size:21px;
 font-weight:800;
 margin:18px 0 9px
}

.sub{
 color:var(--muted);
 margin:0 0 12px
}

/* CARDS */
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

.card{
 background:#fff;
 border-radius:22px;
 box-shadow:var(--shadow);
 padding:15px;
 min-height:135px;
 border-left:6px solid var(--blue);
 text-align:left
}

.card h3{
 font-size:17px;
 margin:5px 0
}

.card p{
 font-size:13px;
 color:var(--muted);
 margin:0
}

.ico{font-size:30px}

.course{
 display:flex;
 align-items:center;
 gap:12px;
 border-top:5px solid var(--blue)
}

.num{
 background:#eaf4ff;
 border-radius:12px;
 padding:5px 9px;
 font-size:25px;
 font-weight:800
}

.course b{
 margin-left:auto;
 font-size:23px
}

/* CHAPTER */
.chapter{
 border-left:5px solid var(--blue);
 min-height:125px;
 display:flex;
 flex-direction:column;
 justify-content:space-between
}

.chapter h3{
 font-size:16px;
 margin:0
}

.chapter button{
 margin-top:10px;
 align-self:flex-start
}

.back{
 background:#eaf3ff;
 color:var(--nav);
 border-radius:11px;
 padding:8px 12px;
 font-weight:700;
 margin:4px 0 8px
}

/* DETAIL */
.detail{
 background:#fff;
 border-radius:22px;
 box-shadow:var(--shadow);
 padding:17px
}

.detail h1{
 font-size:22px;
 margin:4px 0
}

.tag{
 display:inline-block;
 background:#eef5ff;
 color:#27669b;
 border-radius:99px;
 padding:4px 9px;
 font-size:12px
}

.resgrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:11px;
 margin-top:14px
}

.resource{
 background:#f7fbff;
 border:1px solid #dce8f4;
 border-radius:17px;
 padding:13px
}

.resource h3{
 font-size:16px;
 margin:0 0 5px
}

.resource p{
 font-size:13px;
 color:var(--muted)
}

.secondary{
 background:#eef5ff;
 color:var(--ink);
 border:1px solid #d4e3f2;
 border-radius:10px;
 padding:8px 11px;
 font-weight:700
}

/* MOCK TEST */
.qbox{
 background:#fff;
 border:1px solid #dce8f4;
 border-radius:17px;
 padding:13px;
 margin:11px 0
}

.qbox h4{
 font-size:15px;
 margin:0 0 8px
}

.opt{
 display:block;
 background:#f7faff;
 border:1px solid #dce8f4;
 border-radius:10px;
 padding:8px;
 margin:6px 0
}

.result{
 background:#edf9f4;
 border-left:5px solid var(--green);
 padding:12px;
 border-radius:14px
}

.wrong{
 background:#fff1f1;
 border-left-color:var(--red)
}

.ok{
 color:#008b59;
 font-weight:800
}

.bad{
 color:#c9232e;
 font-weight:800
}

/* FORMS */
.form{
 background:#fff;
 border-radius:22px;
 box-shadow:var(--shadow);
 padding:15px;
 margin:12px 0
}

label{
 display:block;
 font-weight:700;
 margin:8px 0 4px
}

input,textarea,select{
 width:100%;
 border:1px solid #cfddea;
 border-radius:10px;
 padding:9px;
 background:#fff;
 color:var(--ink)
}

textarea{
 min-height:95px
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px
}

.warn{
 background:#fff9e8;
 border-left:5px solid var(--orange);
 padding:10px;
 border-radius:12px;
 font-size:13px
}

/* BOTTOM NAV */
.bottom{
 position:fixed;
 z-index:30;
 left:0;
 right:0;
 bottom:0;
 background:#fff;
 border-top:1px solid #dce7f2;
 display:grid;
 grid-template-columns:repeat(6,1fr);
 padding:5px 3px;
 box-shadow:0 -4px 16px #0001
}

.bottom button{
 background:none;
 color:var(--ink);
 font-size:10px;
 font-weight:700;
 padding:2px
}

.bi{
 font-size:21px;
 display:block
}

/* DRAWER */
.drawer{
 position:fixed;
 z-index:100;
 top:0;
 bottom:0;
 left:-300px;
 width:285px;
 background:#fff;
 padding:20px;
 box-shadow:8px 0 25px #0003;
 transition:.2s;
 overflow:auto
}

.drawer.open{left:0}

.drawer button{
 display:block;
 width:100%;
 text-align:left;
 background:#f3f7fc;
 border-radius:10px;
 padding:10px;
 margin:7px 0;
 font-weight:700;
 color:var(--ink)
}

.shade{
 display:none;
 position:fixed;
 z-index:90;
 inset:0;
 background:#0005
}

.shade.show{display:block}

.toast{
 display:none;
 position:fixed;
 z-index:200;
 left:50%;
 bottom:85px;
 transform:translateX(-50%);
 background:#102f4e;
 color:#fff;
 padding:9px 15px;
 border-radius:99px
}

.toast.show{display:block}

/* WATERMARK */
.protected{
 position:relative;
 overflow:hidden
}

.protected:after{
 content:"বাংলা পাঠশালা • আশিস হাইত";
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
 color:#123f69;
 opacity:.07;
 transform:rotate(-22deg);
 pointer-events:none;
 white-space:nowrap
}

@media(max-width:650px){
 .brand{font-size:19px}
 .loginTop{padding:9px 12px;font-size:14px}
 .title{font-size:20px}
 .resgrid{grid-template-columns:1fr}
}

@media(min-width:800px){
 .resgrid{grid-template-columns:repeat(3,1fr)}
}

@media print{
 body *{display:none!important}
}
</style>
</head>

<body>

<div id="drawer" class="drawer"></div>

/* =========================
   QUESTION BANK
========================= */

function questions(cid,i){

 let d=D(cid,i);

 if(d.qs?.length)
  return d.qs;

 let ch=Cc(cid)[3][i];

 return [

 {
  q:`“${ch}” অধ্যায়ের জন্য কোন ব্যবস্থা থাকবে?`,
  o:[
   "শুধু বই",
   "নোট + ভিডিও + Study Material + Mock Test",
   "শুধু ভিডিও",
   "শুধু PDF"
  ],
  a:1
 },

 {
  q:"প্রতিটি অধ্যায় কি আলাদা Study Space পাবে?",
  o:[
   "হ্যাঁ",
   "না",
   "শুধু দশম",
   "শুধু কলেজ"
  ],
  a:0
 }

 ];

}

========================= */

function testPage(cid,i){

 S.test={
  cid,
  i,
  q:[...questions(cid,i)]
   .sort(()=>Math.random()-.5)
   .slice(0,10),
  ans:{}
 };

 S.result=false;
 S.p="test";

 render();
}

function testRender(){

 let t=S.test;
 let c=Cc(t.cid);
 let ch=c[3][t.i];

 return `

 <button
  class="back"
  data-a="chapter"
  data-id="${t.cid}"
  data-i="${t.i}"
 >
  ← অধ্যায়ে ফিরুন
 </button>

 <section class="detail">

  <span class="tag">Mock Test</span>

  <h1>📝 ${esc(ch)}</h1>

  <p class="sub">
   ${t.q.length}টি Random প্রশ্ন
  </p>

  <form id="tf">

  ${t.q.map((q,n)=>`

   <div class="qbox">

    <h4>
     ${n+1}. ${esc(q.q)}
    </h4>

    ${q.o.map((o,j)=>`

     <label class="opt">

      <input
       type="radio"
       name="q${n}"
       value="${j}"
      >

      ${esc(o)}

     </label>

    `).join("")}

   </div>

  `).join("")}

  <button class="primary">
   ✅ Submit Test
  </button>

  </form>

 </section>
 `;
}

/* =========================
   RESULT
========================= */

function result(){

 let t=S.test;
 let score=0;
 let ans=0;

 let rows=t.q.map((q,n)=>{

  let a=t.ans[n];

  if(a!==undefined){
   ans++;
   if(a===q.a)score++;
  }

  return `

  <div class="qbox ${a===q.a?"":"wrong"}">

   <h4>
    ${n+1}. ${esc(q.q)}
   </h4>

   <div class="${a===q.a?"ok":"bad"}">

    ${
     a===undefined
     ?"উত্তর দেওয়া হয়নি"
     :a===q.a
     ?"✓ সঠিক উত্তর"
     :"✗ ভুল উত্তর"
    }

   </div>

   ${
    a!==q.a
    ?`<p>
       <b>সঠিক উত্তর:</b>
       ${esc(q.o[q.a])}
      </p>`
    :""
   }

  </div>

  `;

 }).join("");

 return `

 <section class="detail">

  <h1>📊 Mock Test Result</h1>

  <div class="result">

   <b>
    Score: ${score}/${t.q.length}
   </b>

   <br>

   শতাংশ:
   ${Math.round(score/t.q.length*100)}%

   • উত্তর:
   ${ans}

  </div>

  ${rows}

  <button
   class="primary"
   data-a="retry"
  >
   🔄 আবার পরীক্ষা
  </button>

  <button
   class="secondary"
   data-a="home"
  >
   🏠 Home
  </button>

 </section>

 `;
}

/* =========================
   BUTTON EVENTS
========================= */

document.addEventListener("click",e=>{

 let b=e.target.closest("[data-a]");

 if(!b)return;

 let a=b.dataset.a;

 if(a=="drawer")
  return drawer();

 if(a=="home")
  return go("home");

 if(a=="courses")
  return go("courses");

 if(a=="course")
  return go(
   "course",
   {id:b.dataset.id}
  );

 if(a=="chapter")
  return go(
   "chapter",
   {
    id:b.dataset.id,
    i:+b.dataset.i
   }
  );

 if(a=="notice")
  return go("notice");

 if(a=="grammar")
  return go("grammar");

 if(a=="gdetail")
  return go(
   "gdetail",
   {i:+b.dataset.i}
  );

 if(a=="college")
  return go("college");

 if(a=="models")
  return go("models");

 if(a=="help")
  return go(
   "help",
   {
    title:"❓ Help",
    text:
    "শ্রেণি নির্বাচন → অধ্যায় খুলুন → নোট/ভিডিও/PDF → Mock Test।"
   }
  );

 if(a=="login")
  return go("login");

 if(a=="admin")
  return go("admin");

 if([
  "freeclass",
  "freepdf",
  "freequiz",
  "links",
  "mycourses"
 ].includes(a))

  return go(
   "simple",
   {
    title:a,
    text:
    "এই section-এর content Teacher/Admin পরে যোগ করতে পারবেন।"
   }
  );

 if(a=="wa")
  return window.open(
   "https://wa.me/",
   "_blank"
  );

 if(a=="mail")
  return location.href="mailto:";

 if(a=="chat")
  return toast(
   "Chat link পরে যোগ করুন।"
  );

 if(a=="empty")
  return toast(
   "এই content এখনও যোগ করা হয়নি।"
  );

 if(a=="url")
  return window.open(
   b.dataset.url,
   "_blank"
  );

 if(a=="notes"){

  S.p="notes";

  S.text=
   D(
    S.id,
    S.i
   ).notes;

  return render();

 }

 if(a=="test")
  return testPage(
   b.dataset.id,
   +b.dataset.i
  );

 if(a=="retry")
  return testPage(
   S.test.cid,
   S.test.i
  );

 if(a=="dologin"){

  if(
   !$("lu").value||
   !$("lp").value
  )
   return toast(
    "Username ও Password দিন।"
   );

  localStorage.bp_user=
   $("lu").value;

  toast("Login সফল");

  return go("home");
 }

 if(a=="save"){

  let c=$("ac").value;
  let i=+$("ai").value;
  let d=D(c,i);

  d.notes=
   $("an").value.trim();

  d.video=
   $("av").value.trim();

  d.pdf=
   $("ap").value.trim();

  store[K(c,i)]=d;

  save();

  toast(
   "Content Save হয়েছে"
  );

  return;
 }

 if(a=="addq"){

  let c=$("ac").value;
  let i=+$("ai").value;
  let q=$("mq").value.trim();

  if(!q)
   return toast(
    "Question লিখুন"
   );

  let d=D(c,i);

  d.qs=d.qs||[];

  d.qs.push({
   q:q,
   o:[
    $("mo0").value,
    $("mo1").value,
    $("mo2").value,
    $("mo3").value
   ],
   a:+$("ma").value
  });

  store[K(c,i)]=d;

  save();

  toast(
   "MCQ যোগ হয়েছে"
  );

  $("mq").value="";

  return;
 }

 if(a=="addnotice"){

  let t=$("nt").value;
  let x=$("nx").value;

  if(!x)
   return toast(
    "Notice লিখুন"
   );

  notices.unshift({
   title:t,
   text:x
  });

  save();

  toast(
   "Notice Save হয়েছে"
  );

  return;
 }

});

  if(e.target.id!="tf")
   return;

  e.preventDefault();

  S.test.q.forEach(
   (q,n)=>{

    let x=
     document.querySelector(
      `input[name="q${n}"]:checked`
     );

    if(x)
     S.test.ans[n]=+x.value;

   }
  );

  S.result=true;
  S.p="result";

  render();

 }
);

/* ADMIN SELECT */
document.addEventListener(
 "change",
 e=>{

  if(e.target.id=="ac")
   loadAdmin();

  if(e.target.id=="ai")
   loadFields();

 }
);

/* BASIC COPY/PRINT DETERRENCE */
document.addEventListener(
 "contextmenu",
 e=>e.preventDefault()
);

document.addEventListener(
 "keydown",
 e=>{

  if(
   (e.ctrlKey||e.metaKey)&&
   ["c","s","p","u"]
   .includes(e.key.toLowerCase())
  )
   e.preventDefault();

 }
);

/* START */
render();

</script>

</body>
</html>
